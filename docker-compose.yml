# aerosearch — the whole stack.
#
#   docker compose up -d
#
# Every value below has a working default, so this starts on a clean machine with
# no .env file at all. The single exception is API_KEY, your Telegram bot token,
# which nobody can default for you:
#
#   echo 'API_KEY=123456:your-token-from-BotFather' > .env && docker compose up -d
#
# Four services start by default: postgres, minio (object storage), worker
# (indexes what the bot ingests) and bot. Airflow is NOT started — the worker's
# poll loop replaces it; bring it up with `--profile airflow` if you want the UI.
#
# Storage lives in NAMED VOLUMES, not host directories, and the Postgres volume
# carries its major version in its name (pgdata-pg17). That is deliberate: a
# Postgres data directory cannot be read by a different major version, so pinning
# the version into the volume name means a future bump creates a fresh volume
# instead of crashing with "database files are incompatible with server".

# Shared settings for the two app services. They run the same image: the bot
# and the worker both load EmbeddingGemma 2, so building twice would download
# torch twice.
x-app: &app
  # No shared `image:` tag here. Both services build from this same Dockerfile and
  # context, and giving them one tag makes compose build them in PARALLEL into the
  # same name, which fails with: image "aerosearch-app:local": already exists.
  # Per-service default tags (aerosearch-worker / aerosearch-bot) avoid the race,
  # and cost nothing: identical Dockerfile + context means the second build is a
  # full cache hit, and the layers are content-addressed so they are stored once.
  build:
    context: .
    dockerfile: Dockerfile
  environment: &app-env
    DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-aerosearch}
    MINIO_ENDPOINT: minio:8000
    MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
    MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    MINIO_BUCKET: ${MINIO_BUCKET:-media}
    AEROSEARCH_TABLE: ${AEROSEARCH_TABLE:-media}
    # Pinned embedding contract lives in aerosearch/pinned.py; override only to
    # roll back to e5 (a different vector space -- needs a re-embed).
    AEROSEARCH_EMBED_BACKEND: ${AEROSEARCH_EMBED_BACKEND:-gemma2}
  volumes:
    # Model cache: EmbeddingGemma 2 is downloaded once, then reused across
    # restarts and rebuilds by both services.
    - hf-cache:/models
  depends_on:
    postgres: {condition: service_healthy}
    minio: {condition: service_healthy}
  restart: unless-stopped
  networks: [app-network]

x-airflow-env: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-aerosearch}
    # Must be set and stable. This default is a published dev value, which is
    # harmless here because nothing stores Airflow Connections or Variables --
    # all config arrives as env. Set AIRFLOW_FERNET_KEY in .env if that changes.
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-Zp0mn8Hh3nJ1kLqRtVwXyZaBcDeFgHiJkLmNoPqRsTu=}
    AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.session
    AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    # New DAGs are paused by default, which would make the ▶ button queue a run
    # that never starts. Active on arrival instead, so manual triggers just work.
    # Consequence: with no tunnel configured the */15 schedule fails its first
    # task every run -- the log says exactly what to set. Set AEROSEARCH_SCHEDULE=
    # (empty) to go manual-only until your tunnel is permanent.
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "False"
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-aerosearch}
    MINIO_ENDPOINT: minio:8000
    MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
    MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    MINIO_BUCKET: ${MINIO_BUCKET:-media}
    # Where the Kaggle notebook reaches this machine. Without these the DAG
    # fails its first task with instructions instead of burning a GPU session.
    AEROSEARCH_TUNNEL_PG: ${AEROSEARCH_TUNNEL_PG:-}
    AEROSEARCH_TUNNEL_S3: ${AEROSEARCH_TUNNEL_S3:-}
    AEROSEARCH_KAGGLE_ACCOUNT: ${AEROSEARCH_KAGGLE_ACCOUNT:-}
    AEROSEARCH_KAGGLE_ACCELERATOR: ${AEROSEARCH_KAGGLE_ACCELERATOR:-t4}
    AEROSEARCH_BATCH_LIMIT: ${AEROSEARCH_BATCH_LIMIT:-200}
    AEROSEARCH_SCHEDULE: ${AEROSEARCH_SCHEDULE:-*/15 * * * *}
    POSTGRES_USER: ${POSTGRES_USER:-postgres}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    POSTGRES_DB: ${POSTGRES_DB:-aerosearch}
    KAGGLE_TOKENS_DIR: /opt/pool_tokens
    PYTHONPATH: /opt/aerosearch

services:
  # ---------------------------------------------------------------- storage ---
  # S3-compatible object storage for the media itself.
  #
  # This is zenko/cloudserver rather than minio/minio because MinIO DELETED its
  # Docker Hub images on 2026-09-11 (Hub's own API returns "object not found" for
  # every tag; quay.io refuses anonymous pulls), so the old compose file could not
  # start at all. CloudServer is a verified drop-in for the `minio` Python SDK the
  # bot uses. The MINIO_* names are kept so the client code is untouched.
  # It serves the S3 API only — there is no web console.
  minio:
    image: zenko/cloudserver:latest
    environment:
      SCALITY_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      SCALITY_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      S3BACKEND: file            # durable; "mem" loses everything on restart
      REMOTE_MANAGEMENT_DISABLE: "1"
      ENDPOINT: minio
    ports:
      - "${MINIO_PORT:-9000}:8000"   # CloudServer listens on 8000 internally
    volumes:
      - minio-data:/usr/src/app/localData
      - minio-metadata:/usr/src/app/localMetadata
    healthcheck:
      # Unauthenticated ListBuckets answers 403, which proves S3 is serving.
      test: ["CMD-SHELL", "curl -sf -o /dev/null -w '%{http_code}' http://localhost:8000/ | grep -qE '403|200'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    networks: [app-network]

  # Postgres + pgvector. pgvector/pgvector is the project's own image; the
  # previous ankane/pgvector is marked archived on Docker Hub.
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-aerosearch}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata-pg17:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-aerosearch}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    networks: [app-network]

  # ------------------------------------------------------------ aerosearch ---
  # Retrieval server: query embedder (text-only), /search, /stats, upload site.
  # The only local process that holds a model, and it never embeds media.
  server:
    <<: *app
    environment:
      <<: *app-env
    command: ["uvicorn", "aerosearch.server:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "${AEROSEARCH_PORT:-8000}:8000"

  # Telegram frontend: ingest + /search + /stats.
  bot:
    <<: *app
    environment:
      <<: *app-env
      API_KEY: ${API_KEY:?Set your Telegram bot token, e.g. echo 'API_KEY=123456:token-from-BotFather' > .env}
      AEROSEARCH_SERVER: http://server:8000
    working_dir: /app/bot
    command: ["python", "bot.py"]
    depends_on:
      postgres: {condition: service_healthy}
      minio: {condition: service_healthy}
      server: {condition: service_started}

  # --------------------------------------------------------------- airflow ---
  # The scheduler, and the UI you trigger indexing from (http://localhost:8080).
  # Its DAG does no embedding itself: it pushes a notebook to the Kaggle pool and
  # that T4 reaches back through your tunnel. See airflow/dags/index_on_kaggle.py.
  # Migrates Airflow's metadata tables and creates the admin user. Without this
  # the webserver has no schema to talk to and :8080 never answers -- and no user
  # exists to log in with. Runs to completion before the other two start, and is
  # safe to re-run: `db migrate` is idempotent and the user creation is allowed
  # to fail when the account already exists.
  airflow-init:
    build: {context: ., dockerfile: airflow.Dockerfile}
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      <<: *airflow-env
    command:
      - bash
      - -c
      - |
        set -e
        airflow db migrate
        airflow users create --username admin --firstname Admin --lastname User \
          --role Admin --email admin@example.com \
          --password "${AIRFLOW_ADMIN_PASSWORD:-admin}" || true
        echo "airflow ready: log in as admin / ${AIRFLOW_ADMIN_PASSWORD:-admin}"
    restart: "no"
    networks: [app-network]

  airflow-webserver:
    build: {context: ., dockerfile: airflow.Dockerfile}
    depends_on:
      postgres: {condition: service_healthy}
      minio: {condition: service_healthy}
      airflow-init: {condition: service_completed_successfully}
    environment:
      <<: *airflow-env
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - airflow-logs:/opt/airflow/logs
      - hf-cache:/models
      # gpu_pool + the aerosearch package, imported by the DAG.
      - ./gpu_pool:/opt/aerosearch/gpu_pool:ro
      - ./aerosearch:/opt/aerosearch/aerosearch:ro
      # Kaggle pool credentials. Read-only, and never baked into an image.
      - ${KAGGLE_TOKENS_DIR:-~/pool_tokens}:/opt/pool_tokens:ro
    ports:
      - "${AIRFLOW_PORT:-8080}:8080"
    command: webserver
    restart: unless-stopped
    networks: [app-network]

  airflow-scheduler:
    build: {context: ., dockerfile: airflow.Dockerfile}
    depends_on:
      postgres: {condition: service_healthy}
      airflow-init: {condition: service_completed_successfully}
    environment:
      <<: *airflow-env
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - airflow-logs:/opt/airflow/logs
      - hf-cache:/models
      - ./gpu_pool:/opt/aerosearch/gpu_pool:ro
      - ./aerosearch:/opt/aerosearch/aerosearch:ro
      - ${KAGGLE_TOKENS_DIR:-~/pool_tokens}:/opt/pool_tokens:ro
    command: scheduler
    restart: unless-stopped
    networks: [app-network]

networks:
  app-network:

volumes:
  minio-data:
  minio-metadata:
  # Major version is in the name on purpose -- see the note at the top.
  pgdata-pg17:
  hf-cache:
  airflow-logs:
