version: '3.8'
services:
  # S3-compatible object storage. Was minio/minio, which MinIO DELETED from Docker
  # Hub on 2026-09-11 (Hub's own API returns "object not found" for every tag, and
  # quay.io refuses anonymous pulls), so that compose file could no longer start.
  # Zenko CloudServer is the replacement: verified drop-in for the `minio` Python
  # SDK the bot uses (bucket_exists / make_bucket / put_object / get_object /
  # list_objects all behave). Keeps the MINIO_* env names so .env and the client
  # code are untouched.
  minio:
    image: zenko/cloudserver:latest
    ports:
      - "9000:8000"  # S3 API (CloudServer listens on 8000 internally)
    environment:
      # CloudServer's own names for the static credentials.
      - SCALITY_ACCESS_KEY_ID=${MINIO_ROOT_USER}
      - SCALITY_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD}
      - S3BACKEND=file          # durable on disk; "mem" loses everything on restart
      - REMOTE_MANAGEMENT_DISABLE=1
      - ENDPOINT=minio
    volumes:
      - ./minio-data:/usr/src/app/localData
      - ./minio-metadata:/usr/src/app/localMetadata
    healthcheck:
      # Unauthenticated ListBuckets answers 403, which proves S3 is serving.
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/ | grep -qE '403|200'"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  postgres:
    # Was ankane/pgvector, which Docker Hub now reports as archived (unmaintained).
    # pgvector/pgvector is the project's own image and is active.
    image: pgvector/pgvector:pg17
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - app-network

  airflow-webserver:
    build: 
      context: .
      dockerfile: Dockerfile
    # image: custom-airflow:2.9.3
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - AIRFLOW__CORE__FERNET_KEY=${AIRFLOW_FERNET_KEY}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_BUCKET=${MINIO_BUCKET}
      - TELEGRAM_BOT_TOKEN=${API_KEY}
      - AIRFLOW__CORE__DAGS_FOLDER=/tmp/airflow/dags
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    volumes:
      - ./airflow/dags:/tmp/airflow/dags
      - ./airflow/logs:/tmp/airflow/logs
      - ./airflow/plugins:/tmp/airflow/plugins
      - ./bot:/tmp/airflow/bot  # Share bot code for tasks
    ports:
      - "8080:8080"  # Airflow web UI
    command: webserver
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - app-network

  airflow-scheduler:
    build: 
      context: .
      dockerfile: Dockerfile
    # image: custom-airflow:2.9.3
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - AIRFLOW__CORE__FERNET_KEY=${AIRFLOW_FERNET_KEY}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_BUCKET=${MINIO_BUCKET}
      - TELEGRAM_BOT_TOKEN=${API_KEY}
      - AIRFLOW__CORE__DAGS_FOLDER=/tmp/airflow/dags
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    volumes:
      - ./airflow/dags:/tmp/airflow/dags
      - ./airflow/logs:/tmp/airflow/logs
      - ./airflow/plugins:/tmp/airflow/plugins
      - ./bot:/tmp/airflow/bot
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --local"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - app-network

  airflow-init:
    build: 
      context: .
      dockerfile: Dockerfile
    # image: custom-airflow:2.9.3
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - AIRFLOW__CORE__FERNET_KEY=${AIRFLOW_FERNET_KEY}
      - TELEGRAM_BOT_TOKEN=${API_KEY}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    command:
      bash -c "airflow db init && airflow users create --username admin --firstname Admin --lastname User --role Admin --email admin@example.com --password ${AIRFLOW_ADMIN_PASSWORD}"
    networks:
      - app-network

  bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    depends_on:
      minio:
        condition: service_healthy
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - MINIO_ENDPOINT=${MINIO_ENDPOINT}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_BUCKET=${MINIO_BUCKET}
      - TELEGRAM_BOT_TOKEN=${API_KEY}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  minio-data:
  postgres-data:
  airflow-dags:
  airflow-logs:
  airflow-plugins: